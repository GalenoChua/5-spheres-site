<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sensing Quad results</title>
<style>
  :root{
    --ink:#1d2a52; --paper:#faf6ef; --paper-warm:#f3ecdf; --ember:#e8862e;
    --line:#d9cfbe; --muted:#6b6557; --warn:#b4541f; --good:#2f7a52;
    --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .wrap{max-width:980px;margin:0 auto;padding:24px 18px 70px}
  h1{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0 0 3px}
  .sub{color:var(--muted);font-size:.86rem;margin:0 0 18px;max-width:72ch}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  label{display:block;margin-bottom:12px}
  label span{display:block;font-size:.9rem;margin-bottom:5px}
  label .hint{color:var(--muted);font-size:.8rem;margin-bottom:5px}
  input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);
        border-radius:7px;background:var(--paper);color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--ink);
         background:var(--ink);color:#fff;padding:11px 17px;font-weight:600}
  button.ghost{background:transparent;color:var(--ink);font-weight:400}
  button[disabled]{opacity:.45;cursor:default}
  .msg{border-radius:7px;padding:11px 13px;margin:12px 0;font-size:.92rem}
  .msg.err{background:#fdecec;border:1px solid #e9bcbc;color:#8d2b2b}
  .msg.ok{background:#eaf4ee;border:1px solid #bcd9c7;color:var(--good)}
  .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
  @media (max-width:760px){.nums{grid-template-columns:repeat(2,1fr)}}
  .num{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px}
  .num .k{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .num .v{font-family:var(--serif);font-size:1.8rem;line-height:1.1;margin-top:3px}
  h2{font-family:var(--serif);font-size:1.1rem;font-weight:600;margin:22px 0 0}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px;min-width:460px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.n{font-variant-numeric:tabular-nums}
  td.up{color:var(--good)} td.down{color:var(--warn)}
  pre{background:var(--paper-warm);border:1px solid var(--line);border-radius:8px;
      padding:12px;overflow-x:auto;font-family:var(--mono);font-size:.8rem;margin-top:10px}
  .note{color:var(--muted);font-size:.84rem;margin-top:12px;max-width:80ch}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

  <h1>Sensing Quad results</h1>
  <p class="sub">Paste the token in the box below. Nothing with an ampersand or a hash
  in it survives a query string, and whatever does survive is left in browser history.</p>

  <div class="card">
    <label>
      <span>Session</span>
      <input type="text" id="session" value="sensing-drill-2026-09-17" autocomplete="off" spellcheck="false">
    </label>
    <label>
      <span>Token</span>
      <span class="hint">Paste it whole. Any characters are fine here.</span>
      <input type="password" id="token" autocomplete="off">
    </label>
    <div class="row">
      <button id="go">Read the results</button>
      <button class="ghost" id="raw">Show everything, including rows</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="out"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function say(kind, text) {
    $('msg').innerHTML = text ? '<div class="msg ' + kind + '">' + esc(text) + '</div>' : '';
  }
  function num(k, v) {
    return '<div class="num"><div class="k">' + esc(k) + '</div><div class="v">' +
           (v === null || v === undefined ? '&mdash;' : esc(v)) + '</div></div>';
  }
  function table(rows, cols) {
    var h = '<div class="scroll"><table><tr>' +
            cols.map(function (c) { return '<th>' + esc(c[0]) + '</th>'; }).join('') + '</tr>';
    rows.forEach(function (r) {
      h += '<tr>' + cols.map(function (c) {
        var v = r[c[1]];
        var cls = c[1] === 'change' ? (v > 0 ? ' class="n up"' : (v < 0 ? ' class="n down"' : ' class="n"'))
                                    : (typeof v === 'number' ? ' class="n"' : '');
        if (c[1] === 'change' && typeof v === 'number' && v > 0) { v = '+' + v; }
        return '<td' + cls + '>' + esc(v === null || v === undefined ? '—' : v) + '</td>';
      }).join('') + '</tr>';
    });
    return h + '</table></div>';
  }

  function render(d, full) {
    var h = '';
    h += '<div class="card">';
    h += '<div class="nums">' +
      num('Session', d.session) +
      num('People', d.n) +
      num('Re-scored', d.nRescored) +
      num('NPS', d.nps ? d.nps.score : null) +
    '</div>';

    if (d.n === 0) {
      h += '<p class="note">No submissions in this session yet.</p></div>';
      $('out').innerHTML = h;
      return;
    }

    var cols = [['Dimension', 'dimension'], ['From', 'from'], ['To', 'to'],
                ['Change', 'change'], ['Up', 'improved'], ['Same', 'unchanged'],
                ['Down', 'declined']];

    if (d.dimensions) {
      h += '<h2>The four dimensions</h2>' +
           table(d.dimensions, cols.concat([['Chose as focus', 'chosenAsFocus']]));
    }
    if (d.standardShift) {
      h += '<h2 style="color:var(--warn)">Standard shift, WITHDRAWN</h2>' +
           '<div class="msg err"><b>Do not quote these numbers.</b> Withdrawn on ' +
           '17 September. The re-score was run in the wrong place, so this gap no longer ' +
           'isolates the teaching: it contains the teaching, the whole of round two, and ' +
           'the close of a session people enjoyed. It does not belong in a participant ' +
           'email, a social post or a report. Shown only so it is not quietly recomputed ' +
           'and mistaken for a finding.</div>' +
           table(d.standardShift, cols);
    }
    if (d.state) {
      h += '<h2>How they felt, start against end</h2>' + table(d.state, cols);
    }
    if (d.nps) {
      h += '<h2>NPS</h2>' + table([d.nps],
        [['Responses', 'responses'], ['Mean', 'mean'], ['Score', 'score'],
         ['Promoters', 'promoters'], ['Passives', 'passives'], ['Detractors', 'detractors']]);
    }
    if (d.wantResultsEmailed && d.wantResultsEmailed.length) {
      h += '<h2>Asked for their results</h2><p>' +
           d.wantResultsEmailed.map(esc).join('<br>') + '</p>';
    }
    if (d.note) { h += '<p class="note">' + esc(d.note) + '</p>'; }
    h += '</div>';

    if (full && d.rows) {
      h += '<div class="card"><h2>Every row</h2><pre>' +
           esc(JSON.stringify(d.rows, null, 1)) + '</pre></div>';
    }
    $('out').innerHTML = h;
  }

  function read(full) {
    var token = $('token').value;
    var session = $('session').value.trim().toLowerCase();
    if (!token) { say('err', 'Paste the token first.'); return; }
    if (!/^[a-z0-9-]{6,64}$/.test(session)) { say('err', 'That session id does not look right.'); return; }
    say('', '');
    $('go').disabled = true;
    $('raw').disabled = true;
    $('out').innerHTML = '';

    fetch('/.netlify/functions/quad-results', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: token, session: session, full: full === true })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) {
          throw new Error(j.configured
            ? 'The token did not match. The function can see QUAD_TOKEN, so this is the value.'
            : 'The function cannot see QUAD_TOKEN at all. Check the scope and the deploy context.');
        }
        if (!r.ok) { throw new Error(j.error || ('error ' + r.status)); }
        return j;
      });
    }).then(function (j) {
      say('ok', 'Read ' + j.n + ' row' + (j.n === 1 ? '' : 's') + '.');
      render(j, full);
    })['catch'](function (e) {
      say('err', e.message);
    })['finally'](function () {
      $('go').disabled = false;
      $('raw').disabled = false;
    });
  }

  $('go').onclick = function () { read(false); };
  $('raw').onclick = function () { read(true); };
  $('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { read(false); }
  });
}());
</script>
</body>
</html>
