<section class="how" id="how">
  <div class="wrap">
    <div class="label">How a drill works</div>
    <h2>The session is the easy part.</h2>
    <div class="prose" style="margin-bottom:34px">
      <p>Most training ends at the end of the session, which is why most training changes nothing.
        A drill is built the other way round: the session exists to find the one thing you should
        work on, and then you go and work on it. Which means the end of the session is where your
        training begins.</p>
    </div>
    <div class="steps">
      <div class="step">
        <div class="n">01</div>
        <h3>The two hours</h3>
        <p>A short piece of what the research says, stated with its limits. Then you practise in a
          small group and take the hot seat. You score yourself on the skill before and after, and
          we record it at the start and end of every session, so there is data to work with rather
          than a feeling about how it went.</p>
        <span class="cost">&euro;50 a session</span>
      </div>
      <div class="step paired">
        <div class="n">02</div>
        <h3>The ninety days</h3>
        <p>You leave with your lowest score, a simple daily practice, and the anonymised
          before-and-after from the whole room. Ninety days is roughly how long it takes for a
          practice to stop being a thing you have to remember to do. If it helps, we can set you
          up with an accountability buddy from your group.</p>
        <span class="cost">Your time</span>
      </div>
      <div class="step paired">
        <div class="n">03 <span class="dep">&mdash; needs 02</span></div>
        <h3>Supervision, if you want it</h3>
        <p>Without the practice there is nothing to supervise, so this only works on top of the
          ninety days. Send me recordings of yourself using the skill with real people, in real
          situations. If you can't record at work or at home, we design a real-life activity
          instead, and go through that one to one. This is how you find out whether you can do it,
          rather than whether you understood it.</p>
        <span class="cost">&euro;200</span>
      </div>
    </div>
  </div>
</section>

<script>
  /* "I want this" fills the request form rather than firing a silent vote.
     An anonymous tally tells me what people want but gives me no way to tell
     them when it happens, which is the thing they actually asked for. The
     form works on its own if this never runs. */
  (function () {
    var select = document.getElementById('drill-select');
    var email = document.getElementById('drill-email');
    var target = document.getElementById('request');
    if (!select || !target) return;

    document.querySelectorAll('.want').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('.sticky');
        var title = card && card.querySelector('.t');
        if (title) {
          var wanted = title.textContent.trim();
          for (var i = 0; i < select.options.length; i++) {
            if (select.options[i].text.trim() === wanted) { select.selectedIndex = i; break; }
          }
        }
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        /* focus after the scroll settles, or the browser jumps the page again */
        setTimeout(function () { if (email) email.focus({ preventScroll: true }); }, 500);
      });
    });
  })();
</script>
