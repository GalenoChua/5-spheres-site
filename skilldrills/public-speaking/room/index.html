<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The room</title>
<style>
  :root{
    --ink:#1d2a52; --paper:#faf6ef; --paper-warm:#f3ecdf; --ember:#e8862e;
    --line:#d9cfbe; --muted:#6b6557; --good:#2f7a52; --warn:#b4541f;
    --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: Fraunces, Georgia, "Times New Roman", serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:#fff;font-family:var(--sans);line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 36px 60px}
  h1{font-family:var(--serif);font-weight:600;font-size:2.4rem;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:#c9d0e4;font-size:1.05rem;margin:0 0 34px}

  .gate{background:#fff;color:var(--ink);border-radius:12px;padding:20px;max-width:430px}
  .gate label{display:block;margin-bottom:12px}
  .gate label span{display:block;font-size:.88rem;margin-bottom:5px;font-weight:600}
  input{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);
        border-radius:8px;background:var(--paper);color:var(--ink)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ink);
         background:var(--ink);color:#fff;padding:11px 17px;font-weight:600}
  .err{background:#fdecec;border:1px solid #e9bcbc;color:#8d2b2b;
       border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.92rem}

  .strip{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:34px}
  .stat{flex:1 1 220px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
        border-radius:12px;padding:20px 22px}
  .stat.lead{background:var(--ember);border-color:var(--ember)}
  .stat .v{font-family:var(--serif);font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
  .stat .k{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;
           opacity:.8;font-weight:700;margin-top:9px}
  .stat .n{font-size:.92rem;opacity:.75;margin-top:3px}

  .sec{margin-bottom:30px;max-width:72ch}
  .sec h2{font-family:var(--serif);font-size:1.25rem;font-weight:600;margin:0 0 7px;color:var(--ember)}
  .sec p{margin:0;font-size:1.18rem;line-height:1.55}

  .split{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
  .third{flex:1 1 180px;background:rgba(255,255,255,.07);border-radius:10px;padding:14px 16px}
  .third .v{font-family:var(--serif);font-size:2rem;line-height:1}
  .third .k{font-size:.84rem;opacity:.78;margin-top:4px}

  .five{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .f{flex:1 1 120px;background:rgba(255,255,255,.07);border-radius:10px;padding:13px 14px;
     border:1px solid transparent}
  .f.low{border-color:var(--ember)}
  .f .v{font-family:var(--serif);font-size:1.7rem;line-height:1}
  .f .k{font-size:.82rem;opacity:.78;margin-top:3px;text-transform:capitalize}

  .foot{color:#aeb7cf;font-size:.95rem;margin-top:36px;max-width:72ch}
  .hidden{display:none}
  @media (max-width:640px){
    .wrap{padding:24px 18px 40px}
    h1{font-size:1.7rem}
    .stat .v{font-size:2.6rem}
    .sec p{font-size:1.05rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <h1>The room</h1>
    <p class="sub">The numbers to put on a screen. Nobody is named here.</p>
    <div class="gate">
      <label><span>Session</span>
        <input type="text" id="session" autocomplete="off" spellcheck="false"></label>
      <label><span>Facilitator token</span>
        <input type="password" id="token" autocomplete="off"></label>
      <button id="go">Show the room</button>
      <div id="msg"></div>
    </div>
  </div>

  <div id="out" class="hidden"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var FIVE = ['pause', 'pace', 'volume', 'emotion', 'tonality'];
  var params = new URLSearchParams(location.search);
  var timer = null;
  var token = '';

  $('session').value = (params.get('session') || 'asc-2026-10-07').toLowerCase();

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  var dash = '—';
  function n(v) { return (v === null || v === undefined) ? dash : v; }

  function draw(d) {
    var g = d.group;
    var h = '<h1>The room</h1><p class="sub">' + g.spoke + ' of ' + g.inTheRoom +
            ' took the floor. Nobody is named on this screen.</p>';

    h += '<div class="strip">' +
      '<div class="stat lead"><div class="v">' + n(g.appeared) + '</div>' +
        '<div class="k">Appeared</div><div class="n">out of 100, across every speaker</div></div>' +
      '<div class="stat"><div class="v">' + n(g.relay) + '</div>' +
        '<div class="k">Relay</div><div class="n">per cent of the point that survived</div></div>' +
      '<div class="stat"><div class="v">' + n(g.corrected) + '</div>' +
        '<div class="k">Corrected</div><div class="n">moved toward the room after speaking</div></div>' +
    '</div>';

    if (g.relay !== null) {
      h += '<div class="sec"><h2>What survived</h2><p>On average ' + g.relay +
        ' per cent of what a speaker meant came back in what the room wrote down. ' +
        'That number usually comes in lower than people expect, and it is the one worth ' +
        'taking away.</p></div>';
    }

    h += '<div class="sec"><h2>What people thought of themselves</h2>' +
      '<div class="split">' +
      '<div class="third"><div class="v">' + g.overRating + '</div>' +
        '<div class="k">put themselves above the room</div></div>' +
      '<div class="third"><div class="v">' + g.aligned + '</div>' +
        '<div class="k">were close to it</div></div>' +
      '<div class="third"><div class="v">' + g.underRating + '</div>' +
        '<div class="k">put themselves below</div></div>' +
      '</div>';
    if (g.underRating > g.overRating) {
      h += '<p style="margin-top:14px">More people underestimated themselves than ' +
        'overestimated themselves, which is the opposite of what most rooms guess.</p>';
    }
    h += '</div>';

    var ranked = FIVE.filter(function (k) { return g.five[k] !== null; })
      .sort(function (a, b) { return g.five[a] - g.five[b]; });
    if (ranked.length) {
      h += '<div class="sec"><h2>The five</h2><div class="five">' +
        FIVE.map(function (k) {
          return '<div class="f' + (k === ranked[0] ? ' low' : '') + '"><div class="v">' +
            n(g.five[k]) + '</div><div class="k">' + k + '</div></div>';
        }).join('') + '</div>';
      var firsts = FIVE.filter(function (k) { return g.changeFirst[k] > 0; })
        .sort(function (a, b) { return g.changeFirst[b] - g.changeFirst[a]; });
      if (firsts.length) {
        var w = firsts[0];
        h += '<p style="margin-top:14px">' + w.charAt(0).toUpperCase() + w.slice(1) +
          ' was the thing to change first for ' + g.changeFirst[w] +
          ' of you, more than any other.</p>';
      }
      h += '</div>';
    }

    h += '<p class="foot">One morning, ninety seconds each. One occasion is not a pattern, ' +
      'so treat this as somewhere to start. Your own numbers are on your own phone and ' +
      'nobody else has seen them.</p>';

    $('out').innerHTML = h;
  }

  function poll() {
    return fetch('/.netlify/functions/drill-results', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: token, session: $('session').value.trim().toLowerCase(),
                             view: 'group' })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { throw new Error(j.error === 'no' ? 'That token is not right.' : (j.error || 'error')); }
        return j;
      });
    }).then(function (j) {
      $('gate').classList.add('hidden');
      $('out').classList.remove('hidden');
      draw(j);
      if (!timer) { timer = setInterval(poll, 15000); }
    })['catch'](function (e) {
      $('msg').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  $('go').onclick = function () {
    token = $('token').value;
    if (!token) { $('msg').innerHTML = '<div class="err">Paste the token first.</div>'; return; }
    $('msg').innerHTML = '';
    poll();
  };
  $('token').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { $('go').click(); }
  });
}());
</script>
</body>
</html>
